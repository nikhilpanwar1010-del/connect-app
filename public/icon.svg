<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="50%" stop-color="#FF7597"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4EE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Sparkles -->
  <path d="M 120 130 Q 130 110 130 90 Q 130 110 140 130 Q 130 130 130 150 Q 130 130 120 130 Z" fill="#FFF" opacity="0.85"/>
  <path d="M 370 120 Q 380 105 380 90 Q 380 105 390 120 Q 380 120 380 135 Q 380 120 370 120 Z" fill="#FFF" opacity="0.9"/>
  <path d="M 400 370 Q 408 355 408 340 Q 408 355 416 370 Q 408 370 408 385 Q 408 370 400 370 Z" fill="#FFF" opacity="0.75"/>

  <!-- Centered Glowing Heart -->
  <g filter="url(#glow)">
    <path d="M 256 410 C 256 410 100 295 100 195 C 100 130 145 95 205 95 C 238 95 256 120 256 120 C 256 120 274 95 307 95 C 367 95 412 130 412 195 C 412 295 256 410 256 410 Z" fill="url(#heartGrad)"/>
    <!-- Small Pink Inside Heart Heartbeat -->
    <path d="M 256 345 C 256 345 160 270 160 205 C 160 160 190 135 230 135 C 250 135 256 150 256 150 C 256 150 262 135 282 135 C 322 135 352 160 352 205 C 352 270 256 345 256 345 Z" fill="#FF4D8D" opacity="0.25"/>
  </g>
</svg>
